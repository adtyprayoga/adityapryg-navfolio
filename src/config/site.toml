[config.site]
title = "Aditya Prayoga"
description = "Personal site of Aditya Prayoga - notes, projects, and links."
pageTitle = "Aditya Prayoga | Notes, Projects & Links"
pageDescription = "A personal space for writing, project notes, and the links worth keeping in one place."
# Deployed URL. Baked into canonical links, the sitemap, and RSS at build time.
# The SITE_URL build arg (see docker-compose.yml) overrides this; this is the
# fallback used by a plain local build.
url = "https://adityapryg.dev"
repository = "https://github.com/adtyprayoga/adityapryg-navfolio"
footerNote = "Built with Astro on the navfolio theme."

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# UI language. Available values: en (default), id, zh-CN, zh-TW.
# Unknown values fall back to en.
lang = "en"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Writing notes"
kicker = "Notebook archive"
subtitle = "Notes from the margins."
note = "Field notes, drafts, and technical margins arranged for slow browsing."
postsPerPage = 6
# date-fns format pattern. "yyyy" shows the year alone; the underlying dates stay
# full and sortable, and the datetime attribute keeps the exact value.
dateFormat = "yyyy"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Small tools and site systems."
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "Media"
subtitle = "Books, films, and music worth remembering."
note = "One page for books, films, series, albums, and podcasts."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Aditya Prayoga"
handle = "@adtyprayoga"
role = "Software Developer & ISTQB Certified"
email = "adityaprayoga772@gmail.com"
website = "https://adityapryg.dev"
github = "https://github.com/adtyprayoga"
avatar = "/images/f30083fcbf8a673fbe9f2b1a5ab8de84.jpg"

[[config.topNav.links]]
label = "Home"
href = "/"

[[config.topNav.links]]
label = "Blog"
href = "/blog"

[[config.topNav.links]]
label = "Projects"
module = "projects"

[[config.topNav.links]]
label = "Vibe"
module = "vibe"

[[config.topNav.links]]
label = "Media"
module = "media"

[[config.topNav.links]]
label = "About"
href = "/about"

[config.home]

[config.home.quote]
text = [
  "Build things,",
  "write them down,",
  "and keep it all in one place.",
]

[config.home.intro]
# The heading renders as: Hi, <title with name emphasized>.
# "name" MUST appear inside "title" - the component strips it out of the title
# and re-inserts it as the emphasized part. If it does not match, both strings
# render in full and the heading (white-space: nowrap) overflows the layout.
# Keep it short for the same reason.
title = "I'm Aditya"
name = "Aditya"
body = [
  "Software engineer and IT instructor in Jakarta. This is where I keep my notes, projects, and the links I do not want to lose.",
  "Most of it started as something I had to work out anyway, written down so I can find it again.",
]

[config.home.latest]
count = 1
heatmapWeeks = 24
showHeatmapLatest = true
excludeDraft = true
startDate = ""
dateArchiveBaseHref = ""

