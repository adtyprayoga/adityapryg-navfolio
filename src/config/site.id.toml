[config.site]
title = "Aditya Prayoga"
description = "Situs pribadi Aditya Prayoga - catatan, proyek, dan tautan."
pageTitle = "Aditya Prayoga | Catatan, Proyek & Tautan"
pageDescription = "Ruang pribadi untuk tulisan, catatan proyek, dan tautan yang layak disimpan di satu tempat."
# Deployed URL. Baked into canonical links, the sitemap, and RSS at build time.
# The SITE_URL build arg (see docker-compose.yml) overrides this; this is the
# fallback used by a plain local build.
url = "https://adityapryg.dev"
repository = "https://github.com/adtyprayoga/adityapryg-navfolio"
footerNote = "Dibangun dengan Astro di atas tema navfolio."

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# UI language. Available values: en (default), id, zh-CN, zh-TW.
# Unknown values fall back to en.
lang = "id"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Cari catatan..."
maxResults = 6

[config.pages.blog]
title = "Catatan"
kicker = "Arsip catatan"
subtitle = "Catatan dari pinggiran."
note = "Catatan lapangan, draf, dan margin teknis, ditata untuk dibaca pelan."
postsPerPage = 6
# date-fns format pattern. "yyyy" shows the year alone; the underlying dates stay
# full and sortable, and the datetime attribute keeps the exact value.
dateFormat = "yyyy"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Kategori"
kicker = "Jelajahi catatan"
subtitle = ""
note = "Indeks topik yang berulang, dihimpun dari frontmatter artikel."

[config.pages.blog.series]
title = "Seri"
kicker = "Alur baca"
subtitle = ""
note = "Catatan yang saling terhubung, bisa diikuti sesuai urutan penulisannya."

[config.pages.projects]
title = "Proyek"
kicker = "Rak proyek"
subtitle = "Perkakas kecil dan sistem situs."
note = "Rak ringkas untuk pilihan implementasi, rilis, dan eksperimen penerbitan."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Serpihan hidup dan ngoding."
note = "Kurang formal untuk jadi tulisan blog, tapi tetap bagian dari ceritanya."
showTrail = true

[config.pages.media]
title = "Media"
subtitle = "Buku, film, dan musik yang layak diingat."
note = "Satu halaman untuk buku, film, serial, album, dan podcast."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

