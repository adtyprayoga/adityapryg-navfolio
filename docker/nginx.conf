# Cache policy keyed on the request path.
# HTML must revalidate so a redeploy is picked up immediately; content-hashed
# assets under /_astro/ and fonts can be cached indefinitely.
map $uri $navfolio_cache_control {
  default                                              "public, max-age=0, must-revalidate";
  ~^/_astro/                                           "public, max-age=31536000, immutable";
  ~*\.(?:woff2?|ttf|otf|eot)$                          "public, max-age=31536000, immutable";
  ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|mp3|ogg|mp4)$ "public, max-age=2592000";
}

server {
  listen      80;
  listen      [::]:80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  # Coolify terminates TLS at its proxy and forwards plain HTTP over the
  # internal docker network, so without this every log line records the
  # proxy's container IP instead of the visitor's.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  # Cheap target for Coolify's health check: answers without touching disk,
  # and stays 200 even if the site content were somehow missing.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Astro builds directory-style URLs, so /about resolves to /about/index.html.
  # nginx redirects /about -> /about/ on the $uri/ match.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  # Headers are declared once at server level. add_header does not merge across
  # levels, so adding one inside a location would drop all of these.
  add_header Cache-Control          $navfolio_cache_control always;
  add_header X-Content-Type-Options "nosniff"                       always;
  add_header X-Frame-Options        "SAMEORIGIN"                    always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;
  # woff2 is already compressed; do not waste cycles on it.

  # Pagefind ships its index as .pf_* fragments fetched by the search UI.
  location ~* \.(pf_fragment|pf_index|pf_meta|pagefind)$ {
    types { }
    default_type application/octet-stream;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  # Never serve dotfiles that might slip into the build output.
  location ~ /\. { deny all; }
}
